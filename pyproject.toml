[tool.poetry]
name = "pythonproject4"
version = "0.1.0"
description = ""
authors = ["daaaniil <daaaniil1234@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." },
]

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^2.3.1"
openpyxl = "^3.1.5"
requests = "^2.32.4"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
types-requests = "^2.32.0"
pytest = "^8.1.1"
flake8 = "^7.3.0"
python-dotenv = "^1.1.1"
pandas-stubs = "^2.3.0.250703"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[mypy-dotenv]
ignore_missing_imports = true

[tool.black]
line-length = 119
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | dist
)/
'''

[tool.isort]
line_length = 119